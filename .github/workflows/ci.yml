name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest

  packaging:
    runs-on: ubuntu-latest
    env:
      XLAYER_ARTIFACT_DIR: ${{ runner.temp }}/xlayer-artifacts
      XLAYER_REQUIRE_INSTALLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build --outdir "$XLAYER_ARTIFACT_DIR"
      - run: python -m twine check --strict "$XLAYER_ARTIFACT_DIR"/*
      - name: Clean-environment install and full suite (wheel)
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/python -m pip install --upgrade pip
          /tmp/wheel-env/bin/python -m pip install --no-deps "$XLAYER_ARTIFACT_DIR"/*.whl
          /tmp/wheel-env/bin/python -c "
          import pathlib, xlayer
          resolved = pathlib.Path(xlayer.__file__).resolve()
          assert 'site-packages' in resolved.parts, resolved
          print('wheel import resolved from', resolved)
          "
          /tmp/wheel-env/bin/python -m pip install pytest
          /tmp/wheel-env/bin/python -m pytest tests

      - name: Clean-environment install and full suite (sdist)
        run: |
          python -m venv /tmp/sdist-env
          /tmp/sdist-env/bin/python -m pip install --upgrade pip
          /tmp/sdist-env/bin/python -m pip install --no-deps "$XLAYER_ARTIFACT_DIR"/*.tar.gz
          /tmp/sdist-env/bin/python -c "
          import pathlib, xlayer
          resolved = pathlib.Path(xlayer.__file__).resolve()
          assert 'site-packages' in resolved.parts, resolved
          print('sdist import resolved from', resolved)
          "
          /tmp/sdist-env/bin/python -m pip install pytest
          /tmp/sdist-env/bin/python -m pytest tests
